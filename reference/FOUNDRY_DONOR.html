Invariant: octagonal plinth + cubic block + octagonal cookie cutter. Apparatus owns the exact X/Z
laboratory boundary and fixed reveal. Existing substance machinery owns deformation right up to it.

3D · WORKS — T0.1 / AUTHORITATIVE OCTAGON BOUNDARY

The first empty WORKS table exposed an implementation leak: the signed-density grid approximated
the material perimeter while the apparatus used an independent octagonal mesh. The result was a
toothed terrain edge and a reveal whose width drifted around the table.

T0.1 establishes one geometric relationship. The apparatus is a regular octagonal prism. The
material boundary is the constant-perpendicular inset of that same octagon, expressed analytically
as a clipping density during terrain meshing and collision sampling. Deformation remains free
inside the boundary but cannot move or voxelize the laboratory edge. The apparatus now descends
far below the material as one thick monolithic plinth rather than reading as stacked decorative
layers.

Invariant: apparatus owns the boundary; deformable material owns everything inside it.

3D · WORKS — T0 / COPY-FIRST GENESIS
====================================

STATUS
WORKS is a new independent World Lab laboratory copied completely from the authoritative 3D · TEST CHAMBER T2.2 / LOCUS NAVIGATION implementation. This is intentionally a dumb fork, not a refactor and not shared infrastructure. Test Chamber remains unchanged and authoritative for its own lineage.

STARTING QUESTION
WORKS is a surface for stationary and mobile machines at implied miniature scale. It begins before those machines exist. The inherited deformable signed-density material, bearings, gravity registers, local attractor, meteor, sculpting, locus navigation, camera behavior, diagnostics, recovery, and interaction machinery are preserved as available capabilities rather than redesigned up front.

T0 SCENE
The active world is deliberately cleared to one planar octagonal signed-density material volume resting slightly proud of a massive octagonal manufactured apparatus. The apparatus is not terrain and does not participate in sculpting. The material itself is simply octagonal; no special octagonal topology, sector semantics, sockets, directions, or world ontology are introduced. Internally the inherited rectangular signed-density field remains unchanged and merely contains the octagonal solid.

The local gravity attractor remains inherited functionality but is hidden while OFF so the canonical T0 scene contains only material + apparatus. Turning it ON makes the inherited gravity node visible and causal again. Bearings remain absent until spawned. Meteors and deformation leave evidence only when invoked.

WHY THIS EXISTS
The immediate direction is intentionally broader than the earlier Terrordrome traversal framing: stationary and mobile machines should both negotiate world geometry through physical bodies and mechanisms. Candidate future work includes terrain-tolerant/deployable machinery and construction modules that can establish local rectilinear datums by deforming terrain, but none of that machinery exists at T0.

PROCESS
Build truth first. Preserve visible causality. Prefer composable physical relationships over bespoke abilities. Let failure purchase the next mechanism only while it fails cheaply. Failed probes should be reverted rather than fossilized into active machinery. Do not use image generation for implementation. Preserve useful archaeology here as WORKS earns it.

3D · WORKS — E6.0 / WONDER FIELD

Before choosing a unified material language, WORKS needs evidence about the kinds of monumental and impossible architecture its wider world can contain. Twenty-five discrete visual structures are therefore placed directly into the existing world as probes: domes, conservatories, towers, gates, reactors, gardens, sanctums, civic-scale landmarks and stranger objects. They are deliberately heterogeneous in material and scale. They are not a Townscaper-like construction grammar, a building catalog, a city generator, or a promise that all twenty-five belong. The building/object is the compositional atom; later urbanism may arrange discrete functional buildings through radial plans, grids, density fields, terrain, logistics and other higher-level planning rules.

The probes have no gameplay authority. They preserve existing WORKS systems and exist to let human/model inspection discover which silhouettes, transparent volumes, visible interiors, monumental gestures, sparse framing and magical treatments survive at miniature scale. A WONDERS toggle allows comparison against the underlying ecology. WATER can now be toggled independently because water presentation should not prevent inspection of terrain or architecture.

The important question is not which material wins. It is which kinds of visual ontology are worth carrying forward into a later style-guide / Astra expedition. Failed structures should be discarded cheaply; useful visual mechanisms may be promoted only after inspection.
