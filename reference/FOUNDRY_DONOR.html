<script type="text/plain" id="works-e8-city-machine-archaeology">
3D · WORKS — E8.0 / CITY-MACHINE MORPHOLOGY + BIOME PROVENANCE

E7.0 is preserved as archaeology rather than active vocabulary. E6's 25 wonders remain preserved and toggleable but default OFF. Canonical payloads remain untouched. The active civilization probe now treats one miniature-sized atomic entity as an entire implied city.

FORM LANGUAGE: hard octagonal brass/stone massing is primary. Selective partial glass shells reveal dense rectilinear urban greeble with strong height variation and function-biased central verticality. Glass is containment/revelation, not the civilization's universal shape. Rings float freely along routes and are anchored only at city interfaces.

Six city-machines test one shared civilization grammar with different verbs: LAUNCHER CITY has an independently rotating matter-accelerator track; DRONE CITY has distributed launch bays and a visible swarm; UNZIP CITY turns one receiving interface into several outgoing ring routes; THUMPER CITY is low/heavy around a dominant reciprocating apparatus; RESERVOIR CITY wraps a hollow visible matter court; LINK CITY is sparse and vertical with multiple network berths. These are visual/mechanical propositions, not replacements for TURRET, THUMPER, DRONE FACTORY, LINK NODE or other canonical payloads.

BIOME PROVENANCE: terrain surface triangles are colored from a persistent world-space biome field (forest/desert/mountain/wetland). Decoration may later be disposable, but provenance is substrate truth. Extruder-produced ordinary matter inherits biome identity and renders with corresponding color while retaining ordinary bearing physics. This is intentionally a small semantic addition, not a resource/crafting taxonomy.

SCALE: footprint remains comparable to existing large payloads; semantic scale increases drastically. Tiny boxes are architectural greeble implying districts/buildings. A moving component can therefore imply a moving district-scale machine. Creeps may now be read as kaiju-scale organisms without changing their existing behavior.
</script>
<script type="text/plain" id="works-inheritance-pass-1">
3D · WORKS — INHERITANCE PASS 1 / QUIET ENTRY STATE

This distribution build changes presentation defaults, not WORKS mechanics. It opens WORKS on the canonical
flat signed-density surface with water hidden, the E6 wonder field hidden, and the E8 city-machine morphology
field hidden. Canonical payloads, probes, terrain tools, water, wonders, cities, biome provenance, and their
implementation remain present and recoverable through the existing controls.

The purpose is a low-noise first encounter for an inheriting player on a phone. No accessibility interaction
redesign is claimed yet; observed use should provide evidence before changing the UI or control grammar.
</script>
<script type="text/plain" id="works-e4-terrain-archaeology">
3D · WORKS — E4.1 / TERRAIN SHUFFLE

E4.0 established that repeated local density accretion reads as fast geology rather than life, while
forcing expensive recurring terrain rebuilds. Continuous growth probes were removed rather than optimized.

WORKS now starts on the canonical flat signed-density table. RESET WORKS restores that flat T0.

SHUFFLE TERRAIN is deliberately discontinuous: one press synthesizes a new varied height field directly
into the authoritative signed-density volume, then performs exactly one normal terrain rebuild. Broad
noise, finer variation, directional ridges, a basin/highland term, and an isolated mass are randomized
together so repeated presses explore substantially different terrain rather than recoloring one recipe.

The terrain rewrite uses the same world substrate and rebuild path as all other terrain truth. Therefore
the final rendered mesh again authors the retained bearing/drone support field. This is terrain generation,
not terrain simulation; there is no ongoing terrain CPU/remesh cost after the button press.
</script>
<script type="text/plain" id="works-e4-sea-archaeology">
3D · WORKS — E4.3 / EDGE OF WORLD

E4.2 proved that a closed translucent sea volume makes randomized negative relief read immediately as
bounded geography. Inspection exposed z-fighting not at shorelines but at two apparatus coincidences:
the water floor shared the plinth-top plane, and the water side walls shared the terrain cut-wall planes.

E4.3 resolves those relationships geometrically rather than with renderer bias. Terrain retains its inset
WORKS_MATERIAL_APOTHEM boundary. Water now fills outward to WORKS_APPARATUS_APOTHEM, the containing plinth
edge. Its bottom penetrates the apparatus top by 0.32 world units. Water and terrain therefore no longer
own coincident boundary faces, and the water floor no longer terminates coplanar with the plinth top.

The visual relationship is now intentional:
  terrain/material world < water vessel < apparatus boundary.
The sea reaches the literal edge of the represented world while terrain can expose its cut section inside it.

BOUNDED-WORLD DISCOVERY
The octagon has earned a useful interpretation without becoming mandatory world ontology: it can contain a
coherent piece of world at whatever local scale that piece requires. Continuity need not mean one continuous
terrain substrate. Separate bounded locations may preserve their own scale and truth while traversal between
them is expressed by whatever transport belongs to the experience: portals, ferries, doors, vehicles, dreams,
or other mechanisms. This is an architectural possibility, not a portal framework or a requirement that every
lab use bounded geography.

Water remains presentation only: no buoyancy, currents, waves, shoreline logic, underwater state, or machine
behavior. RESET WORKS restores flat terrain; SHUFFLE TERRAIN performs one terrain rewrite/rebuild.
</script>
<script type="text/plain" id="works-e4-meteor-archaeology">
3D · WORKS — E4.4 / METEOR COST CLEANUP

Meteors are rare manual tools today but may later become actor-driven orbital bombardment, so their cost should
scale with event count rather than legacy presentation object count.

Inspection found the flight simulation itself cheap: one head, one line trail, interpolation, and one apparatus
segment test per meteor. Local crater mutation was already bounded. The legitimate expensive event remains the
single authoritative terrain rebuild at impact.

The old impact presentation, however, created 34 individual heat meshes, a point light, and 18 more individually
allocated ember/dust meshes per impact. E4.4 replaces that with two small InstancedMesh batches: one crater heat
batch and one rising-mote batch. The point light is removed. Crater/rim deformation, granular impulse, trajectory,
and impact semantics are unchanged.

The sea also drops MeshPhysicalMaterial transmission/thickness in favor of a translucent MeshStandardMaterial.
The bounded-water read already comes from geometry, opacity, lighting, and terrain occlusion; physical transmission
was unnecessary GPU work, especially when bright meteor fragments were composited through it.

This pass optimizes presentation rather than changing meteor authority. If future actors call sustained orbital
bombardment, the next evidence should come from actual concurrent-meteor profiling before introducing a larger
projectile/FX framework.
</script>
<script type="text/plain" id="works-e4-meteor-bombardment-archaeology">
3D · WORKS — E4.6 / METEOR / METEORS

E4.5 incorrectly made the control itself fire a bombardment and exposed an older sculpt-dispatch bug:
sculpt() attempted terrainDeformation[kind] even though terrain edits are owned by terrainDeformation.edit().
E4.6 repairs that boundary and ignores non-sculpt semantic modes defensively.

The sky tool now behaves as an armed binary choice while preserving the meteor icon:
  first control tap -> ☄ METEOR (armed; no strike yet)
  second control tap -> ☄ METEORS
  subsequent taps -> alternate METEOR / METEORS.
LOOK or another mutually exclusive tool disarms it.

Casting happens by tapping terrain. METEOR calls one full-strength strike at the tapped locus.
METEORS calls ten strikes over roughly three seconds with irregular intervals and a small radial aim wander
around that same tapped locus. The salvo is not map-wide random bombardment.

Bombardment meteors carry impact power 0.1. Their crater/rim signed-density mutation is one tenth strength,
so ten strikes have approximately the terrain-deformation budget of one ordinary meteor while retaining ten
separate trajectories, impacts, granular impulses, and visible consequences. This is deliberately not an
orbital-weapons framework; it remains a finite callable world event suitable for later actor invocation.
</script>
<script type="text/plain" id="works-e4-fps-archaeology">
3D · WORKS — E4.7 / VISIBLE FRAME COST

The decorative bottom note had stopped carrying useful information. It is replaced by a persistent FPS / average
frame-time readout so performance suspicions can become device evidence while ordinary play continues.

The meter counts animation frames over a 250 ms window and updates the DOM only at the end of that window. It does
not instrument subsystems or attempt GPU timing. The existing meteor profiler remains responsible for impact-phase
CPU timings. Together they answer different questions: the profiler exposes where an impact spends synchronous CPU
time; FPS exposes whether the complete rendered ecology is actually missing frames on the current device.

No meteor behavior is changed in this pass. E4.6 remains the current meteor semantics until actor-driven bombardment
creates evidence worth revisiting.
</script>
<script type="text/plain" id="works-e4-meteor-occlusion-archaeology">
3D · WORKS — E4.9 / IMPACT OCCLUSION

E4.8 briefly tested a fading copy of the old terrain mesh after deformation. It was not harmful, but it was judged
unnecessary and is not present here. The terrain again changes appearance exactly when its authoritative rebuild occurs.

The more useful perceptual problem is the meteor's missing impact interval: a bright tracked object reached terrain,
vanished, and immediately exposed the rebuilt crater. E4.9 adds temporary dirty occlusion instead of animating terrain.

Each impact now erupts nine coarse low-poly smoke/dust puffs from the contact locus. They grow quickly into a dense,
opaque-ish dirty burst, spread and rise asymmetrically, then loosen and disappear over about one second. The geometry
is one instanced icosahedron batch and one material per impact. It is intentionally noisy at miniature scale rather
than volumetric, physically simulated, or composed from hundreds of particles.

The crater remains authoritative immediately. Smoke owns no collision, deformation, or simulation truth. Its job is
causal presentation: meteor -> obscured violent interval -> revealed consequence. This tests whether the apparent
'hitch' was partly the eye being asked to witness an instantaneous topology change with no intervening event.
</script>
<script type="text/plain" id="works-e5-weather-deactivated-archaeology">
3D · WORKS — E5.0.2 / PROCEDURAL WEATHER DEACTIVATED

E5.0 tested a persistent shifting cloud layer by reusing the coarse low-poly particulate language discovered in the
meteor impact occlusion. The implementation worked after a narrow E5.0.1 initialization-order repair, but the cloud
layer did not meet the material/readability bar for persistent world weather.

The persistent cloud implementation is removed from the active artifact rather than retained as machinery. The useful
evidence remains: E4.9's temporary impact cloud can read well because it is local, causal, brief, and allowed to be
coarse. That does not imply the same geometry/material grammar reads beautifully as distant atmospheric cloud cover.

Procedural weather is intentionally deferred. When revisited, begin from the perceptual/material question—what makes
cloud, haze, rain, snow, storm mass, or atmospheric depth read beautifully at miniature scale—rather than assuming a
particle vocabulary or promoting the impact-cloud implementation.

E4.9 meteor impact occlusion remains active as one successful local use of the coarse particulate mechanism.
</script>
<script type="text/plain" id="works-e5-item-pipe-archaeology">
3D · WORKS — E5.2 / ITEM PIPE

Weather probes are inactive. PIPE END is an active orbital payload. Two landed ends automatically pair in landing
order: first is intake, second is output. Repeated structural rings frame the route; there is no glass tube.

The pipe transports the same authoritative discrete bearings already used by WORKS, not inventory counters or
cosmetic beads. Ordinary bearings and BIOBALLS may therefore share one stream while retaining provenance. Nearby
unclaimed matter is claimed at the intake, the same physical bearing is constrained along the route, then released
back into world physics at the output.

The route consumes the same mesh-authored conservative support field used by bearings and Drone Factory terrain
negotiation. Samples along the direct route, plus short look-ahead/look-behind samples, lift the conduit above visible
terrain. The path periodically rebuilds after deployment, so later terrain changes are negotiated rather than clipped.

Endpoint removal tears down the conduit and spills claimed contents back into world physics. This is intentionally
not yet a sorter, branching network, inventory system, recipe graph, or generalized logistics ontology.
</script>
<script type="text/plain" id="works-e5-death-fx-fix-archaeology">
3D · WORKS — E5.2.1 / CREATURE DEATH FX REPAIR

Observed failure: a turret killed a FLOATER EGG and the render loop stopped in updateMeteorFx with
"Cannot read properties of undefined (reading 'y')".

This was not caused by pipe placement or pipe transport. Creature death creates a stationary heatLight impact-FX
record with no velocity vector. updateMeteorFx handled swordLight explicitly but allowed heatLight to fall through
to the generic moving-particle branch, which assumes f.v exists and dereferences f.v.y. The bug was latent in the
shared impact-FX dispatcher and can affect CRAWLER, JUMPER, or FLOATER death effects.

Repair is deliberately narrow: heatLight now has its own stationary intensity-fade branch. No pipe behavior,
creature durability, bearing burst, meteor behavior, or other FX semantics changed. Visible diagnostics again
exposed an ownership/type-dispatch mismatch rather than a pipe failure.
</script>
<script type="text/plain" id="world-lab-handoff">
WORLD LAB V0.1 — RESILIENT CORE / CAPACITY PASS
================================================
THIS PASS OPTIMIZES CAPACITY, NOT METEOR OR SWORD FIDELITY.
The laboratory is infrastructure for many grammars. Current meteor/sword implementations are specimens, not privileged architecture.

GRAPHICS FAILURE FINDING
The Android/Chrome sad-face WebGL icon means the browser lost the WebGL context; it is not a Three.js UI element. JS error handlers alone cannot catch this class of failure.

V0.1 CHANGES
- WebGL context loss/restoration is explicitly observed. On loss the animation loop stops and world state remains in CPU memory. On browser restoration, terrain buffers/textures are marked dirty and rendering resumes.
- RECOVER can rebuild the Three.js renderer after recoverable renderer-loop trouble without resetting world state.
- Terrain now owns one retained BufferGeometry. Frequent sculpt/remesh operations update reusable DynamicDrawUsage position/normal buffers instead of disposing and replacing a GPU geometry every stroke. Buffers grow geometrically only when required.
- Terrain normals are generated while copying triangles into the retained buffer; computeVertexNormals no longer scans spare buffer capacity.
- Baseline shadow maps are disabled. A 2048² dynamic shadow map was expensive persistent GPU state that did not define the laboratory's semantics. Future shadows must earn their budget.
- Device pixel ratio is capped at 1.15 for this mobile-first lab. Resolution is a budget, not world state.
- RESET now disposes persistent sword geometry/materials instead of merely removing their groups.

CAPACITY RULE
Prefer retained/poolable resources for high-frequency systems. Persistent semantic objects may own persistent resources. Transient effects should share/pool geometry/material machinery and have bounded populations. Never allocate GPU resources at gesture frequency when an existing buffer can be updated.

RECOVERY RULE
CPU world state is authoritative. GPU resources are a reconstructible view of it. Context loss should pause presentation, preserve the world, and reconstruct presentation when possible.

WORLD LAB — V0 SHARED SPATIAL LABORATORY
========================================

PURPOSE
This is the current common home for the user's little-world experiments. Do not treat Living Miniatures, Touch Probes, orbital interactions, terrain deformation, procedural actors, or future perspective experiments as unrelated projects by default. They are disposable/progressive manifestations of one evolving spatial-toy vocabulary.

V0 QUESTION
Can one persistent volumetric world remain pleasant to inspect and manipulate through multiple observer perspectives while retaining the terrain behaviors and event grammars already earned in earlier probes?

WORLD / PERSPECTIVE / GRAMMAR
WORLD = substance + discrete objects + processes + accumulated history.
PERSPECTIVE = observer/camera/interaction lens onto that same world. Changing VIEW must never rebuild, reinterpret, or mutate world state.
GRAMMAR = a bounded capability that acts on the world: carve, raise, smooth, meteor, embedded sword, and later rip/tether/fling/extrude/rigged actors.

PORTABLE CRAFT KNOWLEDGE — DO NOT RELEARN
- Known-good Three.js browser import: https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js
- Three.js is renderer, not ontology.
- Use visible pre-module window.error + unhandledrejection diagnostics; failures must not go silent.
- Keep one authoritative runtime/world state. Avoid brittle shadow globals and dual ownership.
- Scene-specific visual assets are generated/encoded in-artifact. Do not introduce external texture/model/image dependencies casually.
- Terrain is substance. Geometry is only the current visible boundary. Positive signed density = solid; negative = empty.
- True caves, tunnels, overhangs, craters, cuts and raised forms are topology of the same substance, not decorative meshes.
- Camera transforms are observer transforms, not world transforms. Preserve world state across perspective changes.
- Free inspection is valuable. God-eye panorama is a strong canonical scale, but close inspection is allowed and useful.
- Detail can be authored above normal viewing resolution; perceptual collapse at miniature scale turns many small assertions into richness.
- Greebling/appearance/process belong to the semantic object that gives them meaning; avoid a global decoration pass that knows every object type.
- Directional effects should derive from explicit semantic direction/state, not incidental mesh orientation.
- Persistent consequences belong to world state; transient FX clarify events and then die.
- FX resource ownership must be explicit. Shared resources are not disposed by individual effects. Bound sustained transient populations on mobile.
- Impact residue belongs to the resulting cavity/state, not stale pre-impact surface coordinates. Depth-test it so topology occludes it.
- A probe is not allowed to redefine the thing it is probing. Promote lessons carefully; preserve local failures as evidence rather than universal law.

PRESERVED DISCOVERIES / ARCHAEOLOGY
T0.4 STATIC PAINTERLY PROBE: pulled-back miniature scale + dense object-owned geometric evidence produced a dramatic improvement even without fog. Distance is a visual budget, not a prohibition on zoom.
T0.5 ABYSS: real topology mattered; ecology had to respect cuts; shared boundaries beat independently approximated seams; continuous wall/skirt beat spaghetti terraces.
T0.7 DEFORMABLE SUBSTANCE: coarse signed-density field + synchronous remesh was fast and responsive on the target phone. This is the foundation used here.
T0.8.2 METEOR RESIDUE: tiny impacts became fading Dark-Souls-like bonfires when heat/embers lived volumetrically inside the wound.
T0.8.4.1 FX HARDENING: explicit resource ownership, shared transient geometry and bounded populations survived sustained meteor/sword abuse.
T0.9–T0.11 SEMANTIC CARVING: noun-to-shape compilation failed; iterative affordance evaluation was richer, but scalar metrics reward-hacked themselves. This branch is preserved knowledge, not the current focus.
TOUCH T0.1: stable world substance + touch-defined topology + liberated debris + ballistic deposited material was a powerful cheap 2D interaction sketchpad.
TOUCH SKYHOOK: touch should establish physical relationships between hand and world rather than merely map gestures to UI commands. Successful cheap touch grammars are candidates for promotion here; the brown 2D substrate is not a replacement world architecture.

CURRENT WORLD
The current world is intentionally modest: one seeded volumetric landmass rendered from a 30×22×30 signed-density field. It is not the final visual target and not a claim that all future worlds share this resolution or geology.

CURRENT OWNERSHIP MODEL
WORLD SUBSTRATE owns authoritative terrain/material truth and its deformation realization.
WORLD SYSTEMS own cross-entity rules such as gravity/support evaluation.
ENTITY CAPABILITIES carry reusable live data such as GravityBody, spatial input/output ports, and semantic local forward. Directional entities author local +Z as forward; behaviors express intent against that entity-level convention rather than inventing mesh-specific signs.
PAYLOAD BEHAVIORS own machine-specific state and continuous meaning: scan, fire, chew, thump, crawl.
PRESENTATION may visualize causality (link pulses, sparks, glow) without claiming additional physical simulation.
Promote machinery only when repeated world evidence makes ownership cross-cutting; capability is not authority.

CURRENT PERSPECTIVES
VIEW cycles PANORAMA / MINIATURE / CLOSE. They are convenience presets over one camera/world, not separate scenes. LOOK then allows free orbit; two fingers pan/pinch and wheel zoom remains available. Future situated/character perspectives should obey the same invariant: perspective does not redefine world state.

CURRENT TERRAIN OWNERSHIP + VERBS
The signed-density terrain substrate owns deformation. Callers request physical changes through terrainDeformation; callers do not own field mutation, remeshing, cache invalidation, or support consequences.
RAISE adds substance. CARVE subtracts substance. SMOOTH relaxes local density. SURFACE CARVE expresses physical intent from a sampled surface inward and is converted by terrain into a lattice mutation deep enough to cross the visible isosurface reliably.
Human sculpting, Extruder bites, meteor craters and payload destruction all enter through this terrain-owned boundary while retaining their own cause-specific shapes/behavior. ONE TERRAIN BITE is currently the shared surface-carve scale used by Extruder chew and Crawler death.
METEOR is a persistent mutually exclusive sky-rain grammar that excavates the same field and leaves bounded volumetric fading residue.
SWORDS is a sibling sky-rain grammar whose blades embed persistently while fire/ember/smoke residue remains ephemeral.
RESET restores the canonical WORKS T0 octagonal planar field and clears event artifacts. VIEW changes only observation.

TOUCH / INTERACTION THESIS
Do not start by inventing gestures. Invent physical relationships between hand and world. Cheap probes established useful candidate verbs: RIP, SPRAY, DROP, FLING, TETHER/PULL, JOIN, EXTRUDE/CHANNEL. These are interaction grammars, not a mandatory final control scheme.
Before inventing an in-world machine, ask whether the player's hand can simply be that machine.

NEXT RICH AREA
Procedural articulation: simple rigs with root/body/limb chains/joints/end effectors; behaviors target constraints rather than canned animation names. Deformable worlds especially reward procedural bodies because authored animation assumes authored geometry. A tiny multi-legged actor that genuinely seeks footholds on deformed terrain is a good bounded proof. Do not build a universal character system first.

HANDOFF MAINTENANCE RULE
This embedded semantic layer is part of the artifact, not cleanup documentation. Update it whenever implementation changes architecture, ownership, interaction meaning, portable craft knowledge, or an important experimental lesson. Keep portable knowledge distinct from probe-local observations. A fresh model receiving only the latest World Lab artifact should not need to rediscover imports, boot/diagnostic discipline, terrain ontology, camera semantics, or already-paid-for behavior lessons before continuing.
</script><script type="text/plain" id="test-chamber-current-semantics">
3D TEST CHAMBER — T1 GRANULAR / CAUSAL FLOW

T1.1 — COLLAPSIBLE LAB CONTROLS
The chamber control surface starts open but is now owned by one persistent TEST CHAMBER binary toggle. Collapsing it removes the experiment controls from the world view without changing simulation state, active interaction mode, or any world state. This is lab-local UI; the World Lab host remains ignorant of chamber controls.

T1.2 — OBSERVER / EMITTER MANIPULATION
The chamber now separates three observer/manipulation verbs: LOOK orbits freely, DRAG CAMERA pans the observer target, and two-finger pinch continues to zoom while translating the camera target with the pinch centroid. MOVE EMITTERS directly drags either physical ball emitter across a horizontal world plane; emission originates from the emitter’s live transform rather than hard-coded coordinates. Moving Source B also updates the visible A→B causal link. These are observer and infrastructure manipulations only: moving the camera never mutates world state, while moving an emitter explicitly does.


The chamber is an independent lab. It inherits no runtime dependency from 3D VOLUMETRIC, though this first pass deliberately retained its signed-density terrain, direct deformation, camera, meteor/sword grammar, and graphics diagnostics as earned evidence.

The active question is whether visible matter/population flow remains intrinsically satisfying when the human manipulates causes rather than puppeteering outcomes. Two physical bearing streams are coupled by a collector/link/emitter chain. The link is visible and severable. A physical gate can interrupt flow. Terrain deformation changes routes. Meteors deform terrain and impart impulse to granular matter. Twenty deliberately cheap walkers share the changing terrain but pursue their own deterministic destination pressure.

Granular representation is intentionally hybrid and approximate. Balls have independent position/velocity state and are rendered with instancing; high population registers reduce rendered sampling. Collision uses a cached top-surface query derived from the authoritative volumetric field, plus a cheap occupancy pile term. This means caves/overhangs are not yet full granular collision volumes and ball-ball collision is not rigid-body exact. Those are explicit compromises in service of testing causal legibility at 1K→100K scale.

Population ladder is evidence, not a score. The useful result is the largest regime where flow, interruption, rerouting and intervention remain legible and tactile.

The external first-pass specification that caused this implementation is embedded verbatim in #test-chamber-first-pass-spec so future workers can distinguish intended experiment from implementation evidence.


T2 — CLEAN MATERIALS YARD / PRE-BUILD INTENT + IMPLEMENTATION ARCHAEOLOGY
The preceding T1 chamber produced unexpected evidence worth protecting: 100k bearings remained smooth; settled piles were metastable; carving a retaining lip produced slow gravity-accelerated streams; carving support from beneath a dense pile caused the population to resume falling together; meteor impulse composed temporally, with repeated impacts accelerating already-moving matter.

T2 intentionally removes emitters, collectors, links, gates, swords and lemmings from the default chamber. It is a clean materials-testing yard: broad flat deformable floor, deformable perimeter containment, shallow/medium/steep grades, and a flat vertical terrain wall. No matter exists until explicitly spawned. SPAWN BALLS places the selected atomic bucket at the tapped terrain point. Buckets deliberately extend from 100 through 1M so device/perceptual limits can be discovered rather than assumed. BEARINGS constants remain the T1 baseline. Large populations retain authoritative CPU particle state while rendering is progressively sampled above the previously proven range.

The perimeter is made from the same signed-density terrain as the floor and test forms. It is not an invisible collision fence; breaching it is a legitimate experiment. Terrain brushes now have SMALL/MED/HUGE radius registers. LOOK, DRAG CAMERA, pinch zoom/pan, gravity registers, METEOR, visible diagnostics, context recovery, and the collapsible lab-local menu remain.


T2.1 — LOCAL GRAVITY BALL


T2.2 — LOCUS NAVIGATION / MOBILE BATTLE-ROOM CAMERA
The chamber became spatially interesting enough that observer manipulation itself required a semantic upgrade. FOCUS LOCUS is a mobile-first navigation verb: tapping an addressable node (currently the gravity ball) or any terrain point establishes the observer working locus and smoothly retargets the camera without moving world state. LOOK continues to orbit freely around the current locus; DRAG CAMERA continues to translate it; pinch continues to zoom and pan. FRAME LOCUS restores a useful inspection distance around the current locus without resetting world orientation. The gravity ball is the first world node participating in this grammar; future pylons and other deliberate nodes should become loci rather than inventing separate camera affordances. Empty terrain can create a temporary WORK locus, so observation does not require an object to already exist there. Principle: the world owns coordinates; the observer owns a current locus.
A persistent visible gravity ball now occupies the center of the materials yard and can be toggled independently of global gravity. It is a softened local attractor acting directly on existing bearing velocity state, so its force composes with meteors and global gravity rather than triggering a canned orbit behavior. Its peak acceleration is deliberately below EARTH gravity: it should perturb and gather against 1g without defeating it, pull substantially against LOW gravity, and dominate MICRO gravity. This is a causal-field probe, not yet an energy-gate or pylon system.

DEFERRED / DO NOT FORGET
The human explicitly wants a later construction grammar where pylons can be slammed into the terrain and energy gates formed between them. Do not smuggle that into this clean matter pass. Preserve it as a next experiment candidate.
</script>

<script type="text/plain" id="works-current-semantics">
3D · WORKS — E3.4.1 / CONTACT GRANTS DESCENT

Terrain clearance and terrain interaction are distinct constraints. During ordinary travel, drones remain
above the support-field flight envelope. Only during the final approach to their already-claimed bioball
does that target gain permission to pull the drone below normal clearance. The hard terrain floor remains:
contact permission is not permission to penetrate the world.

This is task-local authority, not a general navigation mode. The failure that exposed it was useful:
terrain-safe flight had made pickup impossible by leaving drones hovering above their own targets.
3D · WORKS — E3.4 / DRONES READ TERRAIN

Drone flight now consumes the mesh-authored bearing support field rather than treating the world as empty
3D space. A drone samples a few points ahead along its intended travel, raises its desired flight envelope
above the highest sampled terrain, and has finite climb/descent authority. A final support-field constraint
prevents momentum from carrying it through newly risen ground.

This is deliberately not navigation or optimal pathfinding. Drones still pursue the same direct targets;
their bodies now have to negotiate the terrain between here and there. The support field earned a second
consumer without becoming a generalized navigation framework.

3D · WORKS — E3.3.1 / BIOBALLS BECOME PERCEPTIBLE

BIOBALL provenance is now visible at miniature scale as a muted lime-green instance color. Ordinary
bearings retain their existing pale metallic appearance. This is presentation of an already-earned
semantic distinction, not a new resource rule: color does not alter physics, claims, collision, or logistics.

3D · WORKS — E3.3 / BIOBALLS

The Drone Factory no longer treats every spherical piece of matter as equivalent work. Bearings now
carry one minimal provenance bit. Ordinary spawned bearings, Extruder output, and turret ammunition
remain ordinary bearings. Bearings released by Crawler, Jumper, and Floater deaths are BIOBALLS.

Drone Factory claims only BIOBALLS. This is not a generalized resource taxonomy: the physical simulation,
rendering, terrain collision, carrying, and deposit behavior remain exactly the same bearing machinery.
The distinction exists because machine ecology earned one semantic difference: drones care about creature
remains and should ignore ammunition, mined/extruded matter, and manually spawned BBs.

Crawler death now joins Jumper and Floater death in producing the same 25-bioball physical shower while
retaining its terrain bite and ember effects.

3D · WORKS — E3.2 / RENDERED TERRAIN AUTHORS BEARING SUPPORT

E3.1 established the correct collision surface by raycasting every bearing against the rendered mesh,
and immediately found the hard performance edge: even roughly ten thousand bearings made exact
per-bearing mesh queries too expensive. That implementation is removed rather than preserved as runtime
machinery.

The useful architecture is the relationship E3.1 exposed. The final terrain rebuild already owns the
clipped marching-tetrahedra triangles the observer sees. That rebuild now rasterizes those final
triangles once into a retained X/Z bearing-support field. Bearings return to constant-time support
lookups while their collision representation is authored by the rendered surface rather than independently
reconstructed from density.

The support field is deliberately conservative: each lookup uses the highest represented corner around
the bearing instead of interpolating downward through visible terrain, and tiny raster holes are filled
from neighboring represented surface. Vertical cookie-cut walls remain apparatus-side collision rather
than terrain-height support.

Ownership is now:
density -> terrain rebuild -> final rendered triangles -> bearing support field -> bearings.

Approximation remains essential for scale. The invariant is not exact triangle collision; it is that the
cheap approximation is derived from, and conservative toward, the visible terrain it represents.

3D · WORKS — E3.0.2 / CONSEQUENTIAL RELATIONSHIPS EARN VISIBILITY

Bearing simulation remains authoritative and may contain far more matter than the InstancedMesh renders.
Ordinary high-population bearing sampling is unchanged. However, a bearing currently claimed by a drone
is force-included in the rendered set when stride sampling would otherwise omit it.

This is presentation, not simulation authority: drones still choose from authoritative bearings rather
than from visible bearings. The rule is narrower and more useful: presentation may simplify world state,
but when a machine establishes a consequential relationship with hidden state, that relationship should
become perceptible.

3D · WORKS — E3.0.1 / FACTORY-OWNED DRONES

Drone lifetime is subordinate to factory lifetime. Drones are now literal children of the factory root,
not independent scene objects. Removing/resetting the factory therefore removes its entire drone swarm
through ordinary scene-graph ownership. Factory removal also releases any bearing claims held by its
drones. Drones are not yet entities and cannot meaningfully survive their factory.

Because orbital delivery may leave the factory at arbitrary yaw, drone targeting remains world-space
while motion is transformed back into factory-local coordinates before updating each child mesh.

3D · WORKS — E3.0 / DRONE FACTORY

WORKS returns from isolated locomotion research to compositional machine ecology. DRONE FACTORY is a
plain near-cube orbital payload with an orange machinery cap. After landing it releases at most fifteen
tiny hovering cube drones.

Each drone has only a tiny physical-purpose loop: SEEK -> CLAIM -> INTERCEPT -> CARRY -> DEPOSIT -> SEEK.
It claims the nearest currently unclaimed physical bearing outside its factory's depot exclusion radius,
flies directly toward that bearing in full 3D, carries the same authoritative bearing home, and deposits
it near the factory. Bearings inside the exclusion radius are ignored, allowing repeated behavior to
produce a depot without inventing storage or inventory.

Claims prevent many drones from converging on one bearing. Claims are local bookkeeping only; no worker,
inventory, routing, or resource ontology is promoted. Drone flight intentionally borrows the Floater
lesson—direct 3D movement can negotiate height without terrain navigation—but gives it a concrete target.

The acceptance question is ecological: does one simple collector make existing bearing-producing events
(Extruder output, death showers, loose piles) acquire new meaning through composition?

3D · WORKS — E2.7.3 / POSITION EARNS ORIENTATION

E2.7.2 let the head author history but still rotated the head geometry toward intention before its
position had turned. The result was a sideways-facing head stepping at roughly forty-five degrees while
the aggregate stance solver continued driving the long body forward.

That authored rotation is removed. Lazy-circle intention now biases only the HEAD PAIR'S candidate
footholds in world space. If those steps create enough asymmetric planted-foot reaction, the front must
physically walk off the old centerline. Only that actual head displacement enters trail history.

Every vertebra's visible forward, including the head's, is derived from the tangent of traveled positional
history. POSITION EARNS ORIENTATION. Followers still consume progressively older head positions.

This is the final intended snake-mechanics probe before returning to orbital delivery. If differential
head stepping cannot bend the traveled path under the current aggregate root stance solver, that is
evidence that this solver cannot support the articulated locomotion proposition without a deeper change;
do not conceal that result with authored spine rotation.

3D · WORKS — E2.7.2 / HEAD AUTHORS THE TRAIL

E2.7.1 removed the expensive/time-driven trail but exposed a locomotion deadlock: every frame the head
itself was reconstructed from the most recent world-space trail sample. Sub-threshold root motion was
therefore canceled before it could accumulate enough displacement to append a new sample. The legs
stepped while the snake remained effectively pinned in place.

The head no longer consumes path history. It remains attached to the moving entity root and AUTHORS
new history from actual displacement. Only the following vertebrae sample older head positions.
This restores the intended ownership boundary: head motion creates history; history shapes followers.

For inspection, WALKING SNAKE now defaults to a slow constant-curvature intention: each specimen chooses
a handedness and traces a wide lazy circle. The head cube alone steers toward that evolving world-space
heading; its legs create the asymmetric planted-foot reactions that turn/move the body. No pathfinder,
self-collision system, or additional gait machinery is introduced.

3D · WORKS — E2.7.1 / DISTANCE-DRIVEN SNAKE TRAIL

E2.7's first path-history implementation regressed badly despite the earlier many-legged Millipede
running acceptably. Three symptoms shared one cause: the trail was born as one point, grew with elapsed
time rather than embodied displacement, and every vertebra repeatedly rescanned a trail up to 420
Vector3s. That produced a startup singularity, shape motion outrunning the feet, and avoidable frame cost.

The snake now seeds a complete straight body history at birth. Trail samples are appended only when
the ACTUAL head has displaced far enough in world space. The trail is short/fixed-size and vertebrae
use direct distance-indexed lookup rather than linear rescans. Shape memory therefore cannot run ahead
of locomotion. Top speed is also brought below the previous gait-outrunning value while preserving the
same leg mechanics.

This is one repair pass, not further snake architecture. After this probe, attention returns to orbital
delivery: an articulated walking snake cannot truthfully arrive from orbit already deployed as a snake.
Deployment/packaging is the next separate question.

3D · WORKS — E2.7 / WALKING SNAKE RESET

E2.6 showed that independently posing rectangular segments makes a slanted train, not a body that follows its own turn. The active proposition is now WALKING SNAKE. Nine roughly cubic walking vertebrae replace elongated blocks, so length comes from repeated relationships rather than long bricks.

The head owns a bounded heading and lays down path history. Successive vertebrae sample progressively older points and orient tangent to that history: the tail follows where the head has been rather than anticipating its turn. Legs retain the earned terrestrial rule and step only along their own vertebra-local headward +Z.

PATH HISTORY IS SHAPE MEMORY, NOT MOTION AUTHORITY. It does not translate the entity root. Planted-foot reaction remains world-motion authority. Conservative head curvature is the first anti-coiling constraint; self-collision is deliberately not introduced yet.

3D · WORKS — E2.6 / HEADWARD TURNING

Play exposed a semantic bypass in E2.5. Millipede footholds were advanced directly along world-space
travel intention, so the animal could strafe sideways even though its morphology was meant to be
head-forward. Intention had accidentally acquired locomotor authority.

The Millipede now has an explicit morphological +Z headward end, marked only by a crude dark nose for
inspection. Each leg advances along its OWN SEGMENT'S local headward axis. World-space travel intention
does not become a stepping vector. Instead it biases articulation most strongly at the head and
progressively less toward the tail. Curved local footholds then create planted-foot reactions; those
reactions remain the only authority translating/yawing the root.

TRAVEL INTENTION MAY STEER SEMANTIC FORWARD; IT MAY NOT REPLACE SEMANTIC FORWARD.
The animal remains deliberately unidirectional. No reverse gait or tail-as-head behavior is introduced.

The edge failure seen in play is not patched here. Large articulated bodies can still outrun the
point-like root boundary and leave anchors/body sections in degenerate relationships. That is retained
as evidence for the next traversal question: whether plausible ground continues through the body's
forward corridor. Do not hide that missing perception with leg deletion, root teleport, or invisible
rescue constraints.

3D · WORKS — E2.5 / TURNING INTENTION

E2.4 established that the articulated millipede walks. This pass asks whether Walker and Millipede
can respond to a changing world-space travel intention without granting intention direct body authority.

BODY FORWARD remains stable entity-local +Z. TRAVEL INTENTION is separate and slowly wanders in
world space. It may change direction; it never rotates or translates a machine directly. Walker
continues to turn through asymmetric foothold/stance reaction. Millipede now accumulates yaw torque
from its own planted-foot reaction, so any turn must emerge through the same embodied seam.

The Millipede remains head-forward and unidirectional. Bidirectional gait is deliberately absent.
Its phase gate now permits one swing per leg per gait cycle, removing the accidental double-tap.
Temporary visual grammar follows Walker: beige body, dark top pieces; orange accent is not identity.

This is not pathfinding. It is a probe of whether semantic travel direction can change while
embodiment retains authority over how, whether, and how quickly the machine actually turns.

3D · WORKS — E2.4.1 / PRESENTATION STATE OWNERSHIP

Play exposed accidental coupling: turret fire changed the emissive state of the shared orange material,
causing orange parts on unrelated machines to pulse simultaneously. The shared material was also
misnamed payloadHot even though orange parts often mean only temporary WORKS construction language.

It is now machineAccentMat: a shared provisional metal/accent language, not behavioral state. The
turret scanner owns a cloned instance because its fire pulse is entity-specific mutable presentation.
SHARED APPEARANCE DOES NOT IMPLY SHARED MUTABLE PRESENTATION STATE.

These crude shared materials and geometries are not final entity identity. A later visual-design pass
may unify the overall WORKS language while giving each proven machine its own geometry and character;
functional morphology and causal readability are the evidence to preserve.

3D · WORKS — E2.4 / ARTICULATED MILLIPEDE PROBE

The rigid Walker platform earned a new question: are its terrestrial leg semantics reusable when the
thing being carried is an articulated spine rather than one rigid trunk? ARTICULATED MILLIPEDE is a
fresh PROBE, not a promoted PAYLOAD and not a generalized robotics framework.

Eight short body segments form a bounded spine. Each segment carries a left/right pair of the same
kind of deliberately cheap two-bone terrestrial legs. Leg pairs use a traveling phase offset rather
than bespoke per-leg choreography. Neighboring body segments carry a small traveling articulation
wave so the trunk itself participates perceptually in locomotion.

The Walker's earned terrestrial invariant is preserved: candidate footholds at or above the owning
hip are rejected before IK. Stance feet remain world anchors and their accumulated positional error
is the only authority translating the specimen. The target/intention never directly moves it.

This probe asks one narrow question: CAN A WALKING PLATFORM'S LEG SEMANTICS SURVIVE RECOMPOSITION
ONTO A REPEATED ARTICULATED BODY? It does not claim realistic centipede dynamics. At miniature scale,
coherent causal reading is the acceptance criterion; close-up robotics fidelity is not.

3D · WORKS — E2.3.1 / TERRESTRIAL FOOTHOLD CUTOFF

Play exposed a semantic violation rather than an IK failure: a foot could solve to overhead terrain.
A terrestrial leg now rejects any candidate support at or above its own world-space hip before the
target reaches IK. Rejection preserves the existing foothold, so inability to find admissible support
remains local failure rather than granting motion authority. No additional step-height, slope,
clearance, or traversal-prediction rules are introduced by this correction.

3D · WORKS — E2.3 / LEG DISCIPLINE

Play established a useful result: E2.2 genuinely traveled, but its legs became kinematically incoherent.
The locomotion seam is therefore preserved. This pass does not redesign gait, increase body authority,
or guarantee success. It adds morphology the first walker proved it needed.

Each leg now owns a body-relative workspace associated with its hip/quadrant. Foothold targets are
clamped to that workspace and to conservative horizontal reach before terrain height is sampled.
A leg cannot casually cross the chassis centerline or choose another leg's territory.

Two-bone IK now has a persistent body-local outward knee hint per leg. The solver may satisfy reach,
but it may not freely choose a new bend side every frame. This is body knowledge, not locomotion.

Heading intent no longer rotates the desired home frame to face the target. A crawl step begins from
the leg's current body-relative home and heading error only biases forward/lateral reach. Existing
stance reaction remains authoritative for trunk translation/yaw.

E2.2 evidence is preserved: a machine can move through stance reaction while IK itself has no
locomotion authority. E2.3 asks the narrower question: can that movement remain mechanically legible
once each limb knows where it belongs?

3D · WORKS — E2.2 / FIRST IK WALKER

The E2.1 Tripod and Walker specimens were scrubbed rather than patched. The experiment now advances one
machine at a time. The only visible PROBE is IK WALKER. Old single-mechanism probe implementations remain
archaeology/code but are not selector choices.

This Walker deliberately borrows established craft instead of rediscovering gait scheduling: a conservative
four-beat crawl moves one foot at a time. Each leg is represented only by hip attachment, two segment lengths,
a world-space effector target, and an analytic two-bone solve. This is research vocabulary, not yet a promised
general limb architecture.

IK HAS NO LOCOMOTION AUTHORITY. It only articulates segments toward an effector target. Intent chooses future
footholds. During stance, feet become world anchors; spring-like reaction from anchor error accelerates and yaws
the trunk. No target, gait phase, IK solve, or controller writes destination-space trunk position or yaw directly.
The result may walk, slip, oscillate, turn poorly, or fail. Those outcomes are evidence about the seam between
semantic machine propositions and lightweight embodiment.

KNOWN CRAFT IS NOT A FAILED EXPERIMENT. 'Build the smallest thing that can teach us something' does not require
re-deriving solved gait/IK mathematics. Established craft may be used as the boring substrate beneath the actual
question: what mechanically meaningful representation is also legible enough for conversational machine invention?

3D · WORKS — E2.1 / BODY MORPHOLOGY + EARNED STEERING

Inspection showed WALKER BASE direct root-yaw steering could spin violently while the legs separately
attempted gait. The target no longer rotates the root. Heading error now biases left/right step timing
and stride; yaw may arise only from asymmetric planted-foot correction. Rocking remains visible evidence.

The first TRIPOD read as a stationary appliance: narrow vertical body with three short appendages.
That specimen was replaced rather than cosmetically tuned. The new proposition separates three very
long load-bearing legs from three independent telescoping manipulators beneath a broad elevated body.
Historical John Christopher Tripod cover imagery informed only the proportion lesson—substantial body
aloft over enormous empty undercarriage—not a design to reproduce. Locomotion/support and manipulation
are now separate mechanical questions. The Tripod likewise receives no direct root-yaw steering.

PROBE selector invariant: only current experimental machine propositions are exposed. Older mechanism
probes remain implemented and documented but must not re-enter the tap-through selector accidentally.

3D · WORKS — E2 / MACHINE PROPOSITIONS

The experimental cupboard now exposes only TRIPOD and WALKER BASE. Earlier mechanism probes remain
implemented as archaeology/test material but no longer occupy the tap-through list. PAYLOAD now means
tried/accepted current-canon unit or machine; PROBE means experimental bucket. Both may use the same
orbital delivery and live-world machinery. Classification is epistemic, not a different physics path.

North star: machines are situated actors, not placed structures. Orbital delivery preserves arbitrary
root orientation. External control is represented as world-space intention (vector/locus/node); each
machine owns the embodied attempt to satisfy it. Intention does not guarantee success. E2 uses a small
deterministic autonomous target only as a temporary stand-in for future human/agent locus assignment.

TRIPOD is a tall trunk with three telescoping axial-force appendages. They are intentionally not named
arms or legs. Each independently seeks terrain-relative extension. Pair/triplet gripping and resultant
force are the proposition under inspection, not pre-scripted FLIP behavior.

WALKER BASE is a mobile trunk with four crude articulated struts. Alternating swing/stance may create
planted contacts. Horizontal trunk displacement is allowed only as correction required to preserve
those planted contacts while joints articulate; there is no destination-space translation. It receives
a distant locus, turns its semantic forward toward it, and if bodily locomotion brings it near the locus
it visibly changes configuration into a deployed-base posture.

These are machine-scale propositions, not claims of success. Human/model inspection remains part of
establishing their mechanical relationships. Failed behavior should be diagnosed rather than hidden
behind animation.

3D · WORKS — E1 PHASE 2C / MECHANICAL TRUTH PASS

Second inspection corrected the experiment's objective: bearings are diagnostic matter, not a universal
acceptance test for machinery. JAWS remain untouched. TUMBLER keeps its visually successful sustained
contact but now relinquishes bearings when rotation no longer plausibly supports them.

FLIPPER's horizontal launch is explicitly reconciled with semantic local forward rather than a world
axis. TENDON stops pretending to be a granular scoop: it now connects attachment points on an
articulated member, with contraction visibly changing configuration. LEG abandons the invisible
vertical-piston correction. Its foot can plant at a real world point; while planted, joint articulation
moves the body by the linkage error required to keep that foot fixed. During swing, gravity resumes.

Current truths under test:
ROTATION MUST LOSE CONTACT NATURALLY.
CONTRACTION MAY BE A RELATIONSHIP BETWEEN ATTACHMENT POINTS.
PLANTED CONTACT CAN TURN ARTICULATION INTO BODY DISPLACEMENT.
DIAGNOSTIC MATERIAL IS NOT A DESIGN OBJECTIVE: BEARINGS REVEAL MECHANICS; MECHANICS DO NOT EXIST TO
MANIPULATE BEARINGS.

No generalized mechanics framework is promoted by this pass.

3D · WORKS — E1 PHASE 2B.1 / TUMBLER RUNTIME REPAIR

Visible diagnostics caught a real Phase 2B integration error during bearing/tumbler contact:
carryBearingWithRotor used dt to derive carried bearing velocity but its helper signature did not
receive dt. The render loop correctly failed visibly rather than continuing in a corrupt state.
The repair is intentionally minimal: updatePhase2Probe now passes its existing frame dt into the
rotor-contact helper. No mechanical semantics changed.

3D · WORKS — E1 PHASE 2B / CONTACT + SUPPORT CONSOLIDATION

User inspection of the first fan-out produced a clean experimental split:
JAWS passed and visibly smoothed granular piles.
FLIPPER launched delightfully but used a world-axis impulse instead of semantic forward.
TUMBLER pushed through bearings but could not carry them upward and over.
TENDON contraction scooped material, but extension passed through instead of pushing it back.
LEG found the ground, disturbed bearings, and pushed its body upward, but then remained suspended
because the probe had modeled a momentary ground reaction rather than persistent support.

The correction pass preserves those findings instead of replacing them with a generalized mechanics
framework. All probes now carry semantic local forward (+Z); Flipper derives horizontal launch impulse
from that direction. Tendon's moving endpoint transmits contact in both contraction and extension.
Tumbler gets a deliberately local sustained-contact proof: bearings inside its rotating cage region
are carried incrementally with rotor motion until geometry/gravity releases them.

LEG now owns vertical velocity. Its body continuously falls under probe-local gravity; foot penetration
against actual terrain/plinth support resolves the body upward and arrests downward velocity only while
the articulated chain reaches the world. When the foot loses support, gravity resumes. This is the
first probe where mechanism configuration constrains what the world can do to the mechanism itself.

No generic ContactSystem, SupportSystem, JointSystem, rigid-body solver, or actuator framework is
promoted yet. The batch has instead sharpened four candidate truths:
DIRECTION BELONGS TO THE MECHANISM, NOT THE WORLD.
PUSH IS NOT CARRY.
CONTRACTION IS NOT BILATERAL CONTACT.
GROUND REACTION IS NOT PERSISTENT SUPPORT.

3D · WORKS — E1 PHASE 2 / MECHANICAL FAN-OUT

Phase 1 passed by direct play: multiple crude linear actuators visibly reorganized persistent bearing
piles, and flat surfaces let the displaced material retain a readable history of work. The actuator
is frozen as proof rather than polished.

The PROBES cupboard now fans that evidence into five additional disposable specimens:
FLIPPER redirects moving-contact consequence through a hinge and attempts angular impulse.
JAWS use opposed translation to compress and temporarily contain bearings.
TUMBLER uses continuous rotation to lift, stir, and spill material.
LEG combines two articulated joints, a foot, terrain contact, and a visibly supported body load.
TENDON expresses actuation as changing distance between attachment points rather than a piston shaft.

These are intentionally heterogeneous local implementations. Their contact approximations operate
directly on the same authoritative CPU bearing state proven useful in Phase 1. Similar-looking code is
not yet evidence for a shared actuator, joint, contact, locomotion, muscle, or rigid-body framework.

The batch's purpose is comparative evidence: discover which mechanical relationships remain useful
when expressed as translation, rotation, containment, support, and contraction. Successful and
instructive failed specimens may coexist on the table. Promotion follows observed repeated truth,
not completion of this list.

3D · WORKS — E1 PHASE 1 / LINEAR ACTUATOR PROOF

Iterative payload development pauses here for a mechanical expedition. PAYLOADS remain the established
POC ecology. A separate PROBES cupboard now hosts disposable specimens inside the same WORKS world.

The first specimen deliberately assumes almost nothing: a crude frame, one translating carriage,
one shaft, and one broad contact face cycling through a fixed stroke. Its only success condition is
whether extension can physically displace ordinary authoritative bearings already belonging to WORKS.

Because WORKS bearings are CPU-authoritative particles rather than rigid-body meshes, this proof uses
a deliberately local swept contact slab at the actuator face to transfer forward velocity into balls.
That is evidence, not yet architecture. No ActuatorComponent, contact engine, rigid-body framework,
joint system, or machine alphabet is promoted by this implementation.

GATE: inspect this specimen in play before fan-out. If contact displacement is legible and useful,
the expedition may rapidly probe rotational redirection, opposed contact, articulated support, and
other mechanisms. If it is not, investigate this boundary rather than layering more machinery on it.

3D · WORKS — T0.22 / TURRET ELEVATION + TRUE MUZZLE

Floater height exposed a presentation gap in the cannon: azimuth tracked semantic forward correctly,
but the barrel did not visually negotiate target elevation. The turret now has a nested pitch pivot
beneath its existing yaw pivot. While tracking, yaw follows horizontal intent and pitch follows target
height. Elevation is presentation/aiming semantics only; it does not steer an in-flight bearing or
grant hitscan. The existing ballistic solver still independently determines the shot trajectory.

Cannon bearings now spawn from the transformed world position of the physical barrel muzzle rather
than a generic machine-center offset. The ballistic solver starts at that muzzle position, so visible
cause and simulated projectile origin agree.

This remains turret-local articulation. One articulated cannon does not yet earn a generalized aiming
or joint system.

3D · WORKS — T0.21 / FLOATER EARNS LIFT

The true Floater no longer fakes hovering by adding a fixed post-gravity Y offset. Its GravityBody now
uses a small payload-specific lift controller: vertical velocity accelerates gradually toward a
terrain-relative hover datum, damps as it approaches, and continuously follows slow sinusoidal
vertical drift while the existing random walk continues horizontally.

The current hover datum is 4.85 units above support. With the Floater body's local geometry this reads
at approximately twice the height of the 3.72-unit Link Node pylon. This is deliberately a tuned
specimen behavior, not yet a generalized flight or buoyancy system. Jumper keeps the accidental
support/gravity interaction that gives it its ballistic-nightmare bounce.

3D · WORKS — T0.20 / JUMPER CANON + TRUE FLOATER

Observed play overruled authored naming. The T0.19 "Floater" did not read as a stable hovering creature:
its support/gravity interaction produced erratic bouncing. That failure was useful. The moving target
became a ballistic problem where a nominal two-hit creature often consumes substantially more shots.
The behavior is retained and canonized as JUMPER EGG rather than corrected away.

A new JUMPER EGG now occupies the original intent: same autonomous wandering family, but held at a
stable elevated support offset. Its body is muted purple with a broad suspended sac and four sparse
jellyfish-like appendages: one longer central spindle and three shorter surrounding tendrils.

The successful bearing-shower consequence earned one small promotion: bearingBurst(origin,count).
It emits ordinary physical world bearings and is shared by Jumper and Floater deaths. This is a mini
physical-consequence system, not loot, drops, rewards, or a generalized death-effects framework.
Crawler death remains distinct: three hits and a terrain bite. Jumper and Floater each take two hits
and release twenty-five bearings.

This turn is also evidence for the root philosophy: unexpected composition was inspected before being
"fixed"; the useful accident was preserved as a new creature, while only the repeated bearing-shower
mechanism was promoted.

3D · WORKS — T0.19 / JUMPER EGG

A second autonomous target was added as a deliberately close sibling rather than a new creature
framework. JUMPER EGG reuses the Crawler's wandering behavior and existing entity/gravity semantics,
with a small local hover presentation. Turrets acquire either egg through the same target search.

Durability is now payload-specific evidence rather than a universal health system: Crawlers take
three cannon hits; Floaters take two. Crawler death keeps its world-owned terrain bite. Floater death
does not deform terrain and instead releases twenty-five ordinary physical bearings into the world,
turning destruction into a granular resource/event. The distinction remains payload behavior because
two specimens do not yet justify generalized combat, loot, death-effect, or locomotion frameworks.

3D · WORKS — T0.17 / ENTITY-LEVEL SEMANTIC FORWARD

Repeated turret-facing corrections exposed directionality split between authored geometry and behavior
math. Direction now begins at the live entity: every entity carries semantic forwardLocal, currently
canonical local +Z. This is intentionally not a full directionality framework.

Directional payload geometry is authored against +Z. A small entity-level yaw helper converts a
world-space intent point into local yaw and turns a payload part toward it. Turret acquisition now
uses that convention directly; the compensating +PI behavior hack is removed. The barrel remains
authored physically along +Z, so geometry, entity semantics and targeting share one statement of
forward.

This is the beginning of reusable positional semantics at entity level. Future directional payloads
may consume the convention without each inventing their own sign/orientation rules; no additional
orientation components or hierarchy are promoted until world evidence earns them.

3D · WORKS — T0.16 / SURFACE-INTENT BITE

T0.15 fixed ownership but play exposed a second problem: a 1.45-radius buried spherical density edit
was an implementation-space request, not a reliable physical statement. At this coarse 30x22x30
lattice it could change density without moving enough samples across the zero isosurface to produce
a visible wound.

Terrain therefore gained surfaceCarve(surfacePoint, radius, depth). Callers identify the actual
surface and desired bite scale; terrain owns conversion into a downward-biased mutation spanning
multiple vertical lattice intervals. ONE TERRAIN BITE is now a real shared physical operation:
Extruder chew and Crawler death both call the same oneTerrainBite() helper with radius 1.45 and
depth 2.8. The Extruder no longer gets a privileged implementation-shaped carve.

This is a refinement of the T0.15 world-owned deformation boundary, not a new subsystem. Meteor
retains its crater-specific shape through the same mutation/commit ownership. Human brush CARVE
remains a direct sculpting verb because its intent is interactive density editing rather than a
surface-material bite.

3D · WORKS — T0.15 / WORLD-OWNED TERRAIN DEFORMATION

Terrain deformation became world-owned when human sculpting, Extruder chewing, meteor impact and
Crawler destruction all needed to alter the same authoritative signed-density substance. Earlier
callers reached field mutation through interaction-shaped or bespoke paths; that made cause and
realization easy to confuse.

terrainDeformation is now the single mutation/commit boundary. Callers describe their physical
delta; terrain owns field mutation, rebuild and derived-support invalidation. The sculpt tool is a
caller, not the owner. Extruder and Crawler death both invoke the same EXTRUDER_BITE_RADIUS carve
operation; Crawler death anchors that carve just beneath its exact live support surface so the wound
actually intersects material. Meteor retains its distinctive crater/rim mutator but commits through
the same terrain-owned boundary and preserves profiler timing.

This is a semantic promotion, not an ECS promotion: terrain is a world substrate, not an entity
component. The artifact's present-tense ownership model and terrain documentation were revised in
addition to preserving this chronological scar.

3D · WORKS — T0.14 / AIM + BITE CALIBRATION

Two observed play corrections, no new architecture. Turret visual yaw is corrected by PI so the
authored +Z barrel faces the acquired Crawler rather than pointing directly away while targeting.
Ballistic shot computation remains world-space and unchanged.

Crawler death terrain damage now uses the same 1.45 carve brush radius as one Extruder chew. The
destruction event therefore has an already-familiar material scale instead of inventing another one.

3D · WORKS — T0.13 / CANNON CANON

Turret-versus-Crawler behavior is now an explicit bounded physical relationship rather than an
accidental infinite-range shot. Turrets search only within a 25-unit horizontal radius and own
their own scan -> acquire -> track -> fire transitions. Their head slews toward acquisition before
a shot is permitted; scanner/barrel motion makes firing state visible.

Cannon rounds are ordinary bearing particles launched with a low ballistic solution using the
currently selected world gravity. A tracked cannon round can register at most one collision event.
Crawler Eggs own hit state and survive four impacts; the fifth consumes the crawler, emits a short
spark shower and buried red thermal glow, and makes a mild local wound in the same deformable terrain.
This is deliberately not a generalized combat/health framework.

The host now defaults to 3D · WORKS when no explicit valid lab hash is supplied. Existing lab
selection and cold-mount behavior remain unchanged.

3D · WORKS — T0.11 / PAYLOADS OWN THEIR MOTION

Payload animation is now explicitly payload-owned behavior rather than a world animation framework.
The behavior system dispatches each live entity to its payload-specific updater; each payload may own
its own semantic state transitions. World systems remain cross-cutting capabilities such as gravity,
support and ports. Reusable motion helpers may emerge later, but motion is not promoted to a component
merely because several things move.

TURRET now continuously expresses state: without a CRAWLER EGG target it performs a slow idle scan
with its orange directional cone; acquisition transitions immediately to tracking and firing when fed.
LINK NODE is now a narrow relay pole with its orange directional head raised above machine clutter.
Its one input and one output terminate at the head so topology reads above the work surface.

Link flow is intentionally representational at this stage. Bright pulses travel EXTRUDER -> LINK NODE
and LINK NODE -> TURRET to make the causal transfer readable, but the logistics system does not yet
solve physical bearing capture or transport from the extruder pile. The real extruded bearings remain
free world substance. This is a deliberate boundary: make the relationship legible before simulating it.

3D · WORKS — T0.10 / PORTS SOLVE ONE PROBLEM

The logistics experiment is intentionally narrower than its substrate. Live entities may now own
arbitrary inputs[] and outputs[] with local spatial socket transforms. This N-port capability exists
so future payloads can instantiate only the ports they actually need; it is not a routing framework.

Current specimens remain deliberately asymmetric:
EXTRUDER = 0I / 1O
LINK NODE = 1I / 1O
TURRET = 1I / 0O

A Link Node can bind exactly one free upstream O and one free downstream I. Ports are exclusive:
a bound port cannot simultaneously serve another Link Node. Connections are provisional; removal of
an endpoint releases the corresponding sockets so surviving nodes can resolve again. Link machinery
queries ports, never EXTRUDER/TURRET classes. Branching, balancing, priorities and typed resources
remain absent until physical evidence earns them.

Extruder conversion was made intentionally profligate without increasing its terrain appetite.
Each existing slow chew removes the same bounded terrain bite but now emits a dense stream of 72
ordinary bearings. The pile is the stockpile; no abstract production counter was introduced.

3D · WORKS — T0.9 / FIRST EARNED ECS PROMOTION

WORKS did not begin with ECS. Individual payloads originally owned their own update behavior because
premature generalization would have hidden what the laboratory was actually discovering. Terrain
deformation then produced a genuinely cross-cutting requirement: every physical payload must remain
subject to gravity after orbital delivery, regardless of machine behavior. Gravity therefore became
the first capability whose ownership clearly belonged to neither a particular payload nor terrain.

ECS enters here because the world earned a system. Every live dropped payload is now an entity and
automatically receives GravityBody at orbital-arrival handoff. Orbital delivery remains an authored
fast slam and is explicitly not gravity. After touchdown, GravitySystem continuously reevaluates
support. Deformable terrain is provisional support; the immutable octagonal plinth top is the absolute
bottom of WORKS. Remove terrain beneath a machine and the machine falls until terrain or plinth catches
it. Machine behavior remains separate from gravity ownership.

The selector is intentionally narrowed to the current experiment: THUMPER, EXTRUDER, LINK NODE,
TURRET, and CRAWLER EGG. Earlier PYLON, SPIDER JACK, MOLE, CRANE SEED, HOPPER, and BRICK bodies and
behavior prototypes remain in source as dormant conceptual specimens rather than active UI clutter.

Artifact scar: this is the exact point where local toy code became a small entity/system substrate,
not because ECS was aesthetically preferred, but because a live world-wide invariant finally demanded it.

3D · WORKS — T0.8 / BEARING LOGISTICS + GRAVITATIONAL DELIVERY

Orbital payloads now fall under explicit downward acceleration after release. The human chooses the
horizontal drop point; runtime gravity owns arrival timing and contact. This replaces the prior
scripted interpolation-to-ground arrival.

Three rough payloads close a first material loop. EXTRUDER slowly bites adjacent signed-density
terrain and emits ordinary physical bearings. LINK NODE dynamically discovers the nearest extruder
and nearest turret; its visible cyan connections are provisional, periodically recomputed, and may
remain half-resolved until a compatible endpoint exists. It consumes actual loose bearings near its
producer and transfers conserved units into turret feed, shown as traveling bearing beads. TURRET
tracks the nearest crawler egg and can fire only when fed; shots are ordinary bearing particles with
velocity and gravity, not a separate projectile ontology.

The intended user grammar remains DROP THING HERE. Routing, loading, target acquisition and relinking
are machine behavior rather than additional human UI. Nodes persist while connections are fluid.
This is deliberately a rough systems probe, not a generalized logistics graph or combat framework.

3D · WORKS — T0.7 / ORBITAL PAYLOAD CUPBOARD

WORKS now has a deliberately small orbital payload vocabulary selectable one at a time from the
lab controls. PAYLOAD cycles the current body; CALL DOWN arms placement; tapping terrain/apparatus
calls that payload from above. Arrival is shared machinery, but payload bodies and behaviors remain
local and intentionally unsystematized.

Current specimens: PYLON establishes a vertical marker; SPIDER JACK deploys four legs and settles
toward level; MOLE performs one bounded excavation after landing; THUMPER repeatedly drives a hammer
and impulses nearby granular matter; CRANE SEED unfolds a mast/boom proposition; HOPPER periodically
emits small bearing batches; CRAWLER EGG becomes a simple terrain-following mobile body; BRICK is
intentionally functionless mass/obstacle evidence.

These are cheap propositions, not a machine ontology or construction API. Their purpose is to let
WORKS discover which bodies and consequences are actually interesting. Procedural browser geometry
is sufficient truth for this pass. Payloads persist until RESET WORKS.

3D · WORKS — T0.6 / PROJECTILE AUTHORITY STOPS AT APPARATUS

The T0.5 plinth collision initially applied only to bearing support/side response. Meteors could
still complete their precomputed terrain trajectory through the manufactured prism and invoke
terrain deformation beneath it. That violated the new ownership boundary.

Meteor flight now sweeps each frame segment against the same immutable analytic octagonal prism.
First apparatus contact terminates the projectile. Contact may still produce visible impact FX and
granular impulse, but it never calls terrain deformation. Terrain impact behavior is unchanged when
the apparatus is not the first physical obstruction.

Rule: physical grammars do not get to act through immutable apparatus.

3D · WORKS — T0.5 / IMMUTABLE PLINTH COLLISION

The octagonal apparatus is now physically authoritative rather than visual scenery. It remains
categorically separate from signed-density terrain and cannot be raised, carved, smoothed, or
deformed by meteors. Bearings collide with its analytic top and vertical octagonal side faces.

Terrain support and apparatus support compose by taking the higher physical surface. Excavating
brown material deeply enough therefore reveals an immutable manufactured floor at the apparatus
top instead of allowing matter to fall through the table. The exposed rim is likewise real support.
Side collision is analytic against the eight prism planes; no mesh collider, BVH, or general physics
engine has been introduced.

Ownership invariant: terrain tools own deformable substance; the apparatus owns its immutable
octagonal prism and collision boundary.

3D · WORKS — T0.4 / METEOR COST PROBE

Meteor impacts showed a noticeable mobile frame hitch. This pass does not prematurely redesign
terrain meshing. It makes the cost visible in the lab itself and removes one demonstrably wasteful
operation: crater/rim deformation now visits only a conservative local grid box instead of scanning
the complete signed-density volume.

The visible METEOR PROFILER reports deformation, complete terrain rebuild with polygonize/clip/
cut-wall/copy/bounds phases, granular impulse, impact-FX construction, and the lazy collision-height
cache rebuild that occurs after terrain mutation. Full terrain remeshing and current FX realization
remain deliberately intact as controls. The next optimization should follow measured device evidence.

T0.2 got the plan-view architecture right but exposed a new implementation leak: clipping the
triangle soup removed geometry outside the octagon without creating the physical cross-section of
the cut, leaving a wafer-thin open shell visible from below.

T0.3 keeps the cubic density block and exact post-mesh octagonal mask unchanged. Boundary edges on
the eight mask planes are recovered from the clipped surface and extruded vertically into the
plinth as brown material cut faces. This closes the visible solid without a collar, second terrain
system, or octagonal density field. Apparatus owns X/Z boundary; material owns the surface and its
cut cross-section.

T0.1 still asked marching tetrahedra to infer an octagonal density boundary. Six faces looked clean
while two opposing faces exposed tetrahedral/grid anisotropy, and the visible reveal wandered.
That approach is retired rather than refined.

T0.2 matches the deliberately dumb mental model: explicit regular octagonal plinth; ordinary
rectilinear signed-density block that does not know it is an octagon; exact post-mesh clipping
against eight apparatus-derived half-planes. Collision/height sampling is rejected outside that
