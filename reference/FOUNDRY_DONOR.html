3D · FOUNDRY T0 — FORK FROM QUIET WORKS HANDOFF
FOUNDRY is a wholesale behavioral fork of the cleaned 3D · WORKS handoff state. WORKS remains
embedded as preserved experimental archaeology. This fork establishes a new active development
surface without promoting shared implementation or rewriting the machinery that earned it.
The octagonal deformable field, matter, creatures, payloads, logistics, diagnostics, and quiet
interaction surface are inherited intact. New Foundry work should revise present-tense semantics
as evidence accumulates while preserving useful WORKS lineage as archaeology.
-->

<!--
3D · WORKS — MOM INHERITANCE PASS 3 / QUIET PLAY SURFACE
This distribution view preserves the full WORKS implementation but makes first contact world-first.
The accumulated laboratory workbench starts collapsed. Three persistent bottom controls expose the
small play grammar: WORLD cycles LOOK / RAISE / CARVE / SMOOTH; DEPLOY toggles LOOK / ARM; PAYLOAD
cycles the active orbital payload. METEOR is one single-strike payload in that cycle rather than a
separate bombardment mode. Camera gestures remain available in LOOK. FPS/frame telemetry is hidden.
Terrain and Extruder yield present as one ordinary material in this inheritance build; E8 biome
provenance code remains archaeological implementation, not active presentation or play semantics.
This is distribution-layer subtraction, not a replacement interaction architecture.

/* E1 PHASE 1 — PROBE CUPBOARD
   PROBES are not PAYLOADS. They are disposable experimental specimens placed into the same WORKS
   world so existing bearings, terrain, gravity, creatures, and failures can interrogate them.
   Promotion into PAYLOADS is earned only through play.

   LINEAR ACTUATOR asks one question: can a visibly articulated member transmit physical consequence
   into ordinary bearing state? No actuator framework is assumed. This specimen is deliberately crude.
*/
const mechanicalProbes=[];
function buildLinearActuatorProbe(x,z){
 const g=new THREE.Group();g.position.set(x,payloadSupportY(x,z),z);scene.add(g);
 const frameMat=new THREE.MeshStandardMaterial({color:0x70777c,roughness:.72,metalness:.22});

 for(const [px,pz] of [[-1.55,-.72],[-1.55,.72],[1.55,-.72],[1.55,.72]])pbox(g,.32,1.55,.32,px,.95,pz,frameMat);
 const carriage=new THREE.Group();carriage.position.set(0,.72,0);g.add(carriage);
 pbox(carriage,.65,.65,1.1,0,0,0,hotMat);pbox(carriage,.34,.34,2.5,0,0,1.55,frameMat);
 const face=pbox(carriage,2.05,1.45,.28,0,0,2.86,hotMat);
 const e={id:'probe-'+nextEntityId++,type:'LINEAR ACTUATOR',g,carriage,face,phase:0,stroke:2.8,born:performance.now(),forwardLocal:new THREE.Vector3(0,0,1)};
 mechanicalProbes.push(e);return e
}
function pushBearingsWithActuator(probe,prevZ,nextZ,dt){
 const wp=new THREE.Vector3();probe.face.getWorldPosition(wp);const dz=nextZ-prevZ;if(dz<=0)return;
 for(let i=0;i<MAX_BALLS;i++)if(balive[i]){
   const dx=bx[i]-wp.x,dy=by[i]-wp.y,dzb=bz[i]-wp.z;
   if(Math.abs(dx)<1.47&&Math.abs(dy)<1.22&&Math.abs(dzb)<.87){
     bz[i]=Math.max(bz[i],wp.z+.87);bvz[i]=Math.max(bvz[i],Math.min(12,2.5+dz/Math.max(.001,dt)*.72));bvy[i]+=dz*.18
   }
 }
}
function updateMechanicalProbes(now,dt){
 for(const p of mechanicalProbes){
   const age=(now-p.born)*.001;
   if(p.type==='LINEAR ACTUATOR'){
     const u=.5-.5*Math.cos(age*1.45),z=u*p.stroke,prev=p.carriage.position.z;
     p.carriage.position.z=z;pushBearingsWithActuator(p,prev,z,dt)
   }else updatePhase2Probe(p,age,dt)

function clearMechanicalProbes(){for(const p of mechanicalProbes)scene.remove(p.g);mechanicalProbes.length=0}

   intentionally crude. Shared architecture is NOT inferred merely because several things move.

   FLIPPER  — angular impulse.
   JAWS     — opposed contact / temporary containment.
   TUMBLER  — continuous rotation / lift-and-spill transport.
   LEG      — articulated contact / body support.

function probeForwardWorld(p){

function carryBearingWithRotor(c,i,da,dt){
 const ry=by[i]-c.y,rz=bz[i]-c.z,r=Math.hypot(ry,rz);
 // Carry only while geometry is plausibly underneath/alongside the bearing.
 // Above the axle the cage relinquishes ownership and gravity gets the bearing back.
 if(r>1.82||ry>.72)return false;
 const co=Math.cos(da),si=Math.sin(da),ny=ry*co-rz*si,nz=ry*si+rz*co;

 bvz[i]=(bvz[i]*.42)+(ry*da/Math.max(.001,dt))*.58;

}
function updatePhase2Probe(p,age,dt){
 if(p.type==='FLIPPER'){
   const a=.5+.5*Math.sin(age*1.7-Math.PI/2),angle=-a*1.18,da=angle-p.prevAngle;p.pivot.rotation.x=angle;p.prevAngle=angle;
   if(da<-.002){
     const c=probeWorldPoint(p.deck),f=probeForwardWorld(p).multiplyScalar(-1);
     const kick=Math.min(13,Math.abs(da)/Math.max(dt,.001)*1.25),forwardKick=Math.min(8,Math.abs(da)/Math.max(dt,.001)*.55);
     bearingNearBox(c.x,c.y,c.z,1.8,.75,1.7,i=>{bvy[i]+=kick;bvx[i]+=f.x*forwardKick;bvz[i]+=f.z*forwardKick})
   }
